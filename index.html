<!DOCTYPE html>
<html lang="de">

<head>
	<meta charset="UTF-8" />
	<title>Krankmeldung</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="manifest" href="manifest.json">
	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		.form-container {
			width: 90%;
			margin: auto;
			padding: 10px;
			position: relative;
		}

		.form-group {
			margin-bottom: 15px;
		}

		label {
			display: block;
			margin-bottom: 5px;
		}

		input[type="text"],
		input[type="date"],
		input[type="time"],
		button {
			width: 100%;
			max-width: 400px;
			height: 60px;
			padding: 5px;
			margin-bottom: 10px;
			box-sizing: border-box;
			font-size: 24px;
			border: 1px solid #ccc;
			border-radius: 4px;
			background-color: #f0f0f0;
			color: #000;
		}

		input[type="date"],
		input[type="time"] {
			-webkit-appearance: none;
			-moz-appearance: none;
			appearance: none;
			padding-right: 10px;
			text-align: center;
			line-height: 60px;
			color: black;
			font-weight: bold;
		}

		button {
			background-color: #2c3e50;
			color: white;
			border: none;
			cursor: pointer;
			text-align: center;
		}

		button:hover {
			background-color: #34495e;
		}

		.checkbox-group {
			display: flex;
			flex-direction: column;
			margin-bottom: 10px;
		}

		.checkbox-group div {
			display: flex;
			align-items: center;
			margin-bottom: 10px;
		}

		.checkbox-group label {
			margin-left: 5px;
			margin-bottom: 0;
		}

		.checkbox-group input[type="checkbox"] {
			width: 30px;
			height: 30px;
			margin-right: 5px;
		}

		.hidden {
			display: none !important;
		}

		.summary-box {
			border: 2px solid #000;
			background-color: #ffffff;
			padding: 15px;
			margin-top: 20px;
			width: 100%;
			max-width: 400px;
			box-sizing: border-box;
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		.summary-box p {
			margin: 5px 0;
			width: 100%;
			display: flex;
			justify-content: flex-start;
			align-items: baseline;
			flex-wrap: wrap;
		}

		.summary-box p span {
			display: block;
			min-width: 150px;
			font-weight: normal;
			text-align: left;
		}

		.summary-box p b {
			font-weight: bold;
			flex-grow: 1;
			text-align: left;
			word-break: break-word;
		}

		.logo-container {
			position: absolute;
			top: -20px;
			right: 10px;
		}

		.logo-container img {
			height: 80px;
			cursor: pointer;
		}

		#employee-list {
			list-style: none;
			padding: 0;
			margin-top: -10px;
			width: 100%;
			max-width: 400px;
			max-height: 200px;
			overflow-y: auto;
			border: 1px solid #ccc;
			background-color: white;
			position: absolute;
			z-index: 1000;
			box-sizing: border-box;
			display: none;
		}

		#employee-list li {
			padding: 10px;
			cursor: pointer;
			font-size: 20px;
		}

		#employee-list li:hover {
			background-color: #f0f0f0;
		}

		.image-upload-section {
			margin-top: 20px;
			padding-top: 20px;
			border-top: 1px solid #eee;
		}

		#uploaded-image {
			max-width: 100%;
			height: auto;
			display: block;
			margin: 10px auto;
			border: 1px solid #ccc;
			box-sizing: border-box;
		}

		.overlay {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.5);
			display: flex;
			justify-content: center;
			align-items: center;
			z-index: 1000;
		}

		.options-popup {
			background: white;
			padding: 20px;
			border-radius: 8px;
			box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
			text-align: center;
			width: 80%;
			max-width: 300px;
		}

		.options-popup button {
			display: block;
			width: 100%;
			margin-bottom: 10px;
		}

		.summary-image-container {
			width: 100%;
			max-width: 350px;
			height: 350px;
			margin: 10px auto;
			border: 1px solid #ccc;
			display: flex;
			justify-content: center;
			align-items: center;
			overflow: hidden;
			background-color: #f9f9f9;
		}

		.summary-image-container img {
			max-width: 100%;
			max-height: 100%;
			object-fit: contain;
		}

		@media print {
			body { font-size: 12pt; margin-top: 50px; }
			#step-0, #step-1, #step-2, #step-3, #step-4 { display: none !important; }
			#step-5 { display: block !important; }
			input, button, .checkbox-group, #employee-list, .image-upload-section, .overlay, .options-popup { display: none !important; }
			.form-container { width: 100%; margin: 0; padding: 0; position: relative; box-sizing: border-box; }
			.logo-container { position: absolute; top: -70px; right: 10px; }
			.logo-container img { height: 80px; max-width: 200px; }
			.summary-box {
				border: 2px solid #000; background-color: #ffffff; padding: 10px 20px;
				width: 100%; max-width: 500px; box-sizing: border-box; text-align: left;
				margin-top: 20px; margin-left: auto; margin-right: auto; font-size: 10pt;
				display: flex; flex-direction: column; align-items: flex-start;
			}
			.summary-box p { margin: 3px 0; width: 100%; display: flex; align-items: baseline; flex-wrap: wrap; }
			.summary-box p span { display: block; flex-basis: 120px; font-weight: normal; text-align: left; padding-right: 10px; }
			.summary-box p b { font-weight: bold; flex-grow: 1; text-align: left; word-break: break-word; margin-left: auto; }
			.summary-image-container {
				width: 150mm; height: 150mm; margin: 5mm auto; display: flex;
				justify-content: center; align-items: center; overflow: hidden;
				page-break-inside: avoid; page-break-before: auto; page-break-after: avoid;
			}
			.summary-image-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
			h1, h2 { text-align: center; font-size: 18pt; margin-bottom: 5px; }
			@page { size: A4; margin: 10mm; }
		}
	</style>
</head>

<body>
	<div class="form-container">
		<div class="logo-container">
			<img id="company-logo" src="https://images.seeklogo.com/logo-png/54/2/motherson-logo-png_seeklogo-544537.png" alt="Firmenlogo" />
		</div>
		<h1>Krankmeldung</h1>
		<form id="sick-leave-form">
			<div class="form-group" id="step-0">
				<h2>Ihre Informationen</h2>
				<label for="user-lastname">Name:</label>
				<input type="text" id="user-lastname" name="user-lastname" required />
				<ul id="employee-list"></ul>
				<label for="user-firstname">Vorname:</label>
				<input type="text" id="user-firstname" name="user-firstname" required />
				<label for="user-pn">Personalnummer:</label>
				<input type="text" id="user-pn" name="user-pn" required />
				<button type="button" onclick="saveUserInfoAndNextStep(1)">Start</button>
			</div>

			<div class="form-group hidden" id="step-1">
				<label for="report-date">Krankmeldung bei SMP erfolgte am:</label>
				<input type="date" id="report-date" name="report-date" />
				<label for="report-time">um:</label>
				<input type="time" id="report-time" name="report-time" />
				<button type="button" onclick="validateStep1AndNext(2)">Weiter</button>
				<button type="button" onclick="prevStep(0)">Zurück</button>

				<div class="image-upload-section">
					<p style="text-align: center; margin: 20px 0;">--- ODER ---</p>
					<button type="button" onclick="triggerFileUpload()">Krankmeldung fotografieren / hochladen</button>
					<input type="file" id="sick-note-image" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
					<img id="uploaded-image" src="" alt="Hochgeladenes Bild der Krankmeldung" style="display: none;">
					<button type="button" id="goToSummaryFromImage" class="hidden" onclick="nextStep(5)">Zur Zusammenfassung</button>
				</div>
			</div>

			<div class="form-group hidden" id="step-2">
				<label for="duration">Dauer der Krankheit:</label>
				<input type="date" id="duration-start" name="duration-start" required /> bis
				<input type="date" id="duration-end" name="duration-end" required />
				<button type="button" onclick="nextStep(3)">Weiter</button>
				<button type="button" onclick="prevStep(1)">Zurück</button>
			</div>
			<div class="form-group hidden" id="step-3">
				<div class="checkbox-group">
					<div>
						<input type="checkbox" id="first-certification" name="certification-type" value="Erstbescheinigung" />
						<label for="first-certification">Erstbescheinigung</label>
					</div>
					<div>
						<input type="checkbox" id="follow-up-certification" name="certification-type" value="Folgebescheinigung" />
						<label for="follow-up-certification">Folgebescheinigung</label>
					</div>
				</div>
				<button type="button" onclick="nextStep(4)">Weiter</button>
				<button type="button" onclick="prevStep(2)">Zurück</button>
			</div>
			<div class="form-group hidden" id="step-4">
				<label for="doctor-visit">Der Arztbesuch war am:</label>
				<input type="date" id="doctor-visit" name="doctor-visit" required />
				<button type="button" onclick="nextStep(5)">Weiter</button>
				<button type="button" onclick="prevStep(3)">Zurück</button>
			</div>
			<div class="form-group hidden" id="step-5">
				<h2>Informationen des Mitarbeiters</h2>
				<div class="summary-box" id="summary"></div>
				
				<!-- PWA-Lösung: Öffnet die Ansicht im Standard-Browser, wo Drucken garantiert klappt -->
				<button type="button" onclick="printSummary()" style="margin-top: 15px; background-color: #27ae60;">🖨️ Im Browser öffnen & Drucken</button>
				<button type="button" onclick="showOptionsPopup()" style="margin-top: 5px;">⚙️ Mehr Optionen (Teilen)</button>
				<button type="button" onclick="prevStep(4)" style="margin-top: 5px; background-color: #7f8c8d;">Zurück</button>
			</div>
		</form>
	</div>

	<div class="overlay hidden" id="image-options-overlay">
		<div class="options-popup">
			<button type="button" id="take-photo-btn">Neues Foto aufnehmen</button>
			<button type="button" id="choose-from-gallery-btn">Aus Galerie wählen</button>
			<button type="button" id="cancel-image-upload-btn">Abbrechen</button>
		</div>
	</div>

			{ lastname: "Maul", firstname: "Eduard", pn: "53196" },
			{ lastname: "Meradzhanova", firstname: "Silviya", pn: "61395" },
			{ lastname: "Qarri", firstname: "Seid", pn: "61694" },
			{ lastname: "Japic", firstname: "Aladin", pn: "54963" },
			{ lastname: "Bratu", firstname: "Stefania-Claudia", pn: "62100" },
			{ lastname: "Gettinger", firstname: "Alexander", pn: "37047" },
			{ lastname: "Fischer", firstname: "David", pn: "37296" },
			{ lastname: "Berthaler", firstname: "Axel", pn: "38674" },
			{ lastname: "Wittmann", firstname: "Herbert", pn: "24257" },
			{ lastname: "Stempizki", firstname: "Alexander", pn: "55848" }
		].sort((a, b) => a.lastname.localeCompare(b.lastname));

		let currentUser = {};
		let sickNoteImageData = null;

		document.addEventListener('DOMContentLoaded', () => {
			const savedUser = localStorage.getItem('currentUser');
			if (savedUser) {
				currentUser = JSON.parse(savedUser);
				document.getElementById('user-lastname').value = currentUser.lastname;
				document.getElementById('user-firstname').value = currentUser.firstname;
				document.getElementById('user-pn').value = currentUser.pn;
			}
			nextStep(0);

			if ('serviceWorker' in navigator) {
				navigator.serviceWorker.register('service-worker.js').catch(err => console.error(err));
			}

			document.getElementById('company-logo').addEventListener('click', () => {
				if (!document.getElementById('step-5').classList.contains('hidden')) {
					showOptionsPopup();
				}
			});

			document.getElementById('take-photo-btn').addEventListener('click', () => {
				const input = document.getElementById('sick-note-image');
				input.setAttribute('capture', 'environment');
				input.click();
				document.getElementById('image-options-overlay').classList.add('hidden');
			});

			document.getElementById('choose-from-gallery-btn').addEventListener('click', () => {
				const input = document.getElementById('sick-note-image');
				input.removeAttribute('capture');
				input.click();
				document.getElementById('image-options-overlay').classList.add('hidden');
			});

			document.getElementById('cancel-image-upload-btn').addEventListener('click', () => {
				document.getElementById('image-options-overlay').classList.add('hidden');
			});

			const lastnameInput = document.getElementById('user-lastname');
			const employeeList = document.getElementById('employee-list');

			lastnameInput.addEventListener('input', function() {
				const input = this.value.toLowerCase();
				if (input.length > 0) {
					const filtered = employeeData.filter(emp => emp.lastname.toLowerCase().startsWith(input));
					displaySuggestions(filtered);
				} else {
					employeeList.innerHTML = '';
					employeeList.style.display = 'none';
				}
			});

			lastnameInput.addEventListener('blur', () => {
				setTimeout(() => { employeeList.style.display = 'none'; }, 200);
			});

			lastnameInput.addEventListener('focus', function() {
				if (this.value.length > 0) { employeeList.style.display = 'block'; }
			});

			function displaySuggestions(employees) {
				employeeList.innerHTML = '';
				if (employees.length > 0) {
					employees.forEach(employee => {
						const li = document.createElement('li');
						li.textContent = `${employee.lastname}, ${employee.firstname}`;
						li.dataset.lastname = employee.lastname;
						li.dataset.firstname = employee.firstname;
						li.dataset.pn = employee.pn;
						li.addEventListener('mousedown', selectEmployee);
						employeeList.appendChild(li);
					});
					employeeList.style.display = 'block';
				} else {
					employeeList.style.display = 'none';
				}
			}

			function selectEmployee(event) {
				const selected = event.currentTarget.dataset;
				document.getElementById('user-lastname').value = selected.lastname;
				document.getElementById('user-firstname').value = selected.firstname;
				document.getElementById('user-pn').value = selected.pn;
				employeeList.style.display = 'none';
				document.getElementById('user-firstname').focus();
			}
		});

		function saveUserInfoAndNextStep(step) {
			const lastname = document.getElementById('user-lastname').value;
			const firstname = document.getElementById('user-firstname').value;
			const pn = document.getElementById('user-pn').value;
			if (!lastname || !firstname || !pn) {
				alert('Bitte füllen Sie alle Felder aus.');
				return;
			}
			currentUser = { lastname, firstname, pn };
			localStorage.setItem('currentUser', JSON.stringify(currentUser));
			nextStep(step);
		}

		function nextStep(step) {
			document.querySelectorAll('.form-group').forEach(s => s.classList.add('hidden'));
			document.getElementById('step-' + step).classList.remove('hidden');
			if (step === 5) { showSummary(); }
		}

		function prevStep(step) {
			document.querySelectorAll('.form-group').forEach(s => s.classList.add('hidden'));
			document.getElementById('step-' + step).classList.remove('hidden');
			if (step === 1) {
				document.getElementById('sick-note-image').value = '';
				document.getElementById('uploaded-image').style.display = 'none';
				document.getElementById('goToSummaryFromImage').classList.add('hidden');
				sickNoteImageData = null;
				document.getElementById('report-date').disabled = false;
				document.getElementById('report-time').disabled = false;
			}
		}

		function triggerFileUpload() {
			document.getElementById('image-options-overlay').classList.remove('hidden');
		}

		function handleImageUpload(event) {
			const file = event.target.files[0];
			if (file) {
				const reader = new FileReader();
				reader.onload = function(e) {
					const imgElement = document.getElementById('uploaded-image');
					imgElement.src = e.target.result;
					imgElement.style.display = 'block';
					sickNoteImageData = e.target.result;
					document.getElementById('goToSummaryFromImage').classList.remove('hidden');
					document.getElementById('report-date').disabled = true;
					document.getElementById('report-time').disabled = true;
				};
				reader.readAsDataURL(file);
			} else {
				document.getElementById('uploaded-image').style.display = 'none';
				document.getElementById('goToSummaryFromImage').classList.add('hidden');
				sickNoteImageData = null;
				document.getElementById('report-date').disabled = false;
				document.getElementById('report-time').disabled = false;
			}
		}

		function validateStep1AndNext(step) {
			const reportDate = document.getElementById("report-date").value;
			const reportTime = document.getElementById("report-time").value;
			if (!sickNoteImageData && (!reportDate || !reportTime)) {
				alert('Bitte füllen Sie die Felder für Datum und Uhrzeit aus ODER laden Sie ein Bild hoch.');
				return;
			}
			if (sickNoteImageData && (reportDate || reportTime)) {
				alert('Entweder Formularfelder ODER Bild hochladen, nicht beides.');
				return;
			}
			nextStep(step);
		}

		function showSummary() {
			const summaryBox = document.getElementById("summary");
			if (sickNoteImageData) {
				summaryBox.innerHTML = `
					<p><span>Personalnummer:</span> <b>${currentUser.pn}</b></p>
					<div class="summary-image-container">
						<img src="${sickNoteImageData}" alt="Hochgeladenes Bild">
					</div>
				`;
			} else {
				const reportDate = document.getElementById("report-date").value.split("-").reverse().join(".");
				const reportTime = document.getElementById("report-time").value;
				const durationStart = document.getElementById("duration-start").value.split("-").reverse().join(".");
				const durationEnd = document.getElementById("duration-end").value.split("-").reverse().join(".");
				const firstCert = document.getElementById("first-certification").checked ? "✓" : "-";
				const followCert = document.getElementById("follow-up-certification").checked ? "✓" : "-";
				const doctorVisit = document.getElementById("doctor-visit").value.split("-").reverse().join(".");

				summaryBox.innerHTML = `
					<p><span>Name:</span> <b>${currentUser.lastname}</b></p>
					<p><span>Vorname:</span> <b>${currentUser.firstname}</b></p>
					<p><span>Personalnummer:</span> <b>${currentUser.pn}</b></p>
					<p><span>Krankmeldung-SMP:</span> <b>${reportDate} / ${reportTime}</b></p>
					<p><span>Dauer von:</span> <b>${durationStart}</b></p>
					<p><span>bis:</span> <b>${durationEnd}</b></p>
					<p><span>Erstbescheinigung:</span> <b>${firstCert}</b></p>
					<p><span>Folgebescheinigung:</span> <b>${followCert}</b></p>
					<p><span>Arztbesuch am:</span> <b>${doctorVisit}</b></p>
				`;
			}
		}

		// Brachialer Ausweg für blockierte PWAs: Erzeugt ein temporäres Dokument als Blob-URL 
		// und öffnet es in einem neuen Tab (führt direkt in den echten Browser, wo window.print funktioniert).
		function printSummary() {
			try {
				const htmlContent = `
					<!DOCTYPE html>
					<html lang="de">
					<head>
						<meta charset="UTF-8">
						<title>Drucken - Krankmeldung</title>
						<style>
							body { font-family: Arial, sans-serif; margin: 20px; }
							h1, h2 { text-align: center; }
							.logo-container { position: absolute; top: 10px; right: 10px; }
							.logo-container img { height: 80px; max-width: 200px; }
							.summary-box {
								border: 2px solid #000; background-color: #ffffff; padding: 10px 20px;
								width: 100%; max-width: 500px; margin: 20px auto; font-size: 11pt;
								display: flex; flex-direction: column; align-items: flex-start; box-sizing: border-box;
							}
							.summary-box p { margin: 5px 0; width: 100%; display: flex; align-items: baseline; }
							.summary-box p span { display: block; flex-basis: 150px; font-weight: normal; text-align: left; }
							.summary-box p b { font-weight: bold; flex-grow: 1; text-align: left; word-break: break-word; }
							.summary-image-container {
								width: 150mm; height: 150mm; margin: 10mm auto; display: flex;
								justify-content: center; align-items: center; overflow: hidden;
							}
							.summary-image-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
						</style>
					</head>
					<body>
						<div class="logo-container">
							<img src="${document.getElementById('company-logo').src}" alt="Logo" />
						</div>
						<h1>Krankmeldung</h1>
						<h2>Informationen des Mitarbeiters</h2>
						<div class="summary-box">
							${document.getElementById('summary').innerHTML}
						</div>
						<script>
							window.onload = function() {
								setTimeout(function() {
									window.print();
								}, 400);
							};
						<\/script>
					</body>
					</html>
				`;

				const blob = new Blob([htmlContent], { type: 'text/html' });
				const url = URL.createObjectURL(blob);
				
				// Öffnet die Ansicht im Standardbrowser (der den Druckdialog problemlos ausführt)
				const newWindow = window.open(url, '_blank');
				if (!newWindow) {
					shareSummary();
				}
			} catch (err) {
				console.error("Fehler:", err);
				shareSummary();
			}
		}

		function showOptionsPopup() {
			const overlay = document.createElement('div');
			overlay.classList.add('overlay');

			const popup = document.createElement('div');
			popup.classList.add('options-popup');

			const shareButton = document.createElement('button');
			shareButton.textContent = 'Teilen';
			shareButton.onclick = () => { shareSummary(); document.body.removeChild(overlay); };
			popup.appendChild(shareButton);

			const printButton = document.createElement('button');
			printButton.textContent = 'Im Browser drucken';
			printButton.onclick = () => { printSummary(); document.body.removeChild(overlay); };
			popup.appendChild(printButton);

			const restartButton = document.createElement('button');
			restartButton.textContent = 'Von vorne beginnen';
			restartButton.onclick = () => { restartForm(); document.body.removeChild(overlay); };
			popup.appendChild(restartButton);

			const closeButton = document.createElement('button');
			closeButton.textContent = 'Abbrechen';
			closeButton.onclick = () => { document.body.removeChild(overlay); };
			popup.appendChild(closeButton);

			overlay.appendChild(popup);
			document.body.appendChild(overlay);
		}

		function shareSummary() {
			const summaryText = document.getElementById('summary').innerText;
			if (navigator.share) {
				navigator.share({ title: 'Krankmeldung Zusammenfassung', text: summaryText }).catch(() => {});
			} else {
				alert('Teilen wird auf diesem Gerät nicht unterstützt. Text:\n\n' + summaryText);
			}
		}

		function restartForm() {
			document.getElementById('sick-leave-form').reset();
			document.getElementById('user-lastname').value = currentUser.lastname;
			document.getElementById('user-firstname').value = currentUser.firstname;
			document.getElementById('user-pn').value = currentUser.pn;
			sickNoteImageData = null;
			document.getElementById('uploaded-image').style.display = 'none';
			document.getElementById('goToSummaryFromImage').classList.add('hidden');
			document.getElementById('report-date').disabled = false;
			document.getElementById('report-time').disabled = false;
			nextStep(0);
		}
	</script>
</body>

</html>
