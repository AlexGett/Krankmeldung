<!DOCTYPE html>
<html lang="de">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Krankmeldung – Zusammenfassung</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 0;
			padding: 20px;
			box-sizing: border-box;
		}

		.logo-container {
			text-align: right;
			margin-bottom: 10px;
		}

		.logo-container img {
			height: 80px;
			max-width: 200px;
		}

		h1,
		h2 {
			text-align: center;
			margin: 5px 0;
		}

		.summary-box {
			border: 2px solid #000;
			background-color: #ffffff;
			padding: 10px 20px;
			max-width: 500px;
			margin: 20px auto;
			box-sizing: border-box;
		}

		.summary-box p {
			display: flex;
			align-items: baseline;
			flex-wrap: wrap;
			margin: 3px 0;
		}

		.summary-box p span {
			flex-basis: 150px;
			font-weight: normal;
			padding-right: 10px;
		}

		.summary-box p b {
			flex-grow: 1;
			font-weight: bold;
			word-break: break-word;
		}

		.summary-image-container {
			width: 100%;
			max-width: 350px;
			margin: 10px auto;
			text-align: center;
		}

		.summary-image-container img {
			max-width: 100%;
			max-height: 350px;
			object-fit: contain;
		}

		.actions {
			max-width: 500px;
			margin: 20px auto;
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		button {
			height: 56px;
			font-size: 20px;
			background-color: #2c3e50;
			color: white;
			border: none;
			border-radius: 4px;
			cursor: pointer;
		}

		button:hover {
			background-color: #34495e;
		}

		#empty-message {
			text-align: center;
			margin-top: 40px;
			color: #555;
		}

		@media print {
			.actions {
				display: none !important;
			}

			@page {
				size: A4;
				margin: 10mm;
			}
		}
	</style>
</head>

<body>
	<div class="logo-container">
		<img src="https://images.seeklogo.com/logo-png/54/2/motherson-logo-png_seeklogo-544537.png" alt="Firmenlogo" />
	</div>
	<h1>Krankmeldung</h1>
	<h2>Informationen des Mitarbeiters</h2>
	<div class="summary-box" id="summary"></div>
	<div class="actions" id="actions"></div>
	<p id="empty-message" style="display: none;">Keine Daten gefunden. Bitte öffnen Sie die Krankmeldung erneut über die App und tippen Sie dort auf "Drucken" oder "Teilen".</p>

	<script>
		const savedHTML = sessionStorage.getItem('krankmeldungSummaryHTML');
		const summaryBox = document.getElementById('summary');
		const actions = document.getElementById('actions');

		if (!savedHTML) {
			document.getElementById('empty-message').style.display = 'block';
			summaryBox.style.display = 'none';
		} else {
			summaryBox.innerHTML = savedHTML;

			const printBtn = document.createElement('button');
			printBtn.textContent = 'Drucken';
			printBtn.onclick = () => window.print();
			actions.appendChild(printBtn);

			if (navigator.share) {
				const shareBtn = document.createElement('button');
				shareBtn.textContent = 'Teilen';
				shareBtn.onclick = () => {
					navigator.share({
						title: 'Krankmeldung Zusammenfassung',
						text: summaryBox.innerText
					}).catch(() => {
						// Vom Nutzer abgebrochen oder nicht unterstützt – kein Fehler nötig
					});
				};
				actions.appendChild(shareBtn);
			}
		}
	</script>
</body>

</html>
